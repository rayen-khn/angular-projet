<div class="counter-card" aria-label="Component communication demo">
  <h3>{{ label }}</h3>

  <div class="counter-panel">
    <button type="button" class="action" (click)="decrease()">-</button>
    <span class="count">{{ value }}</span>
    <button type="button" class="action" (click)="increase()">+</button>
  </div>
</div>
