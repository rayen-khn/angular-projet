<header class="navbar">
  <div class="brand">
    <span class="logo">⚡</span>
    <strong>ConfTech Platform</strong>
  </div>

  <nav class="nav-links">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Accueil
    </a>
    <a routerLink="/conferences" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Catalogue
    </a>
    <a routerLink="/conferences/add" routerLinkActive="active" class="btn-nav-add">
      + Ajouter
    </a>
    <a routerLink="/bookings" routerLinkActive="active" class="booking-link">
      <span>🎟️ Mes Réservations</span>
      <span class="badge" [class.has-bookings]="bookingCount() > 0">
        {{ bookingCount() }}
      </span>
    </a>
    <a routerLink="/admin" routerLinkActive="active">
      Administration
    </a>
  </nav>
</header>
